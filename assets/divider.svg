<svg width="900" height="40" viewBox="0 0 900 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section Divider with walking robot">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1512" stop-opacity="0"/>
      <stop offset="15%" stop-color="#FF6F00"/>
      <stop offset="50%" stop-color="#FDF5E6"/>
      <stop offset="85%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#1A1512" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="18" width="900" height="3" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- little walking robot -->
  <g>
    <animateMotion path="M 0,0 L 860,0 L 0,0" dur="10s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="0.3s" repeatCount="indefinite"/>
      <rect x="0" y="6" width="20" height="14" rx="4" fill="#FF8C00" stroke="#FDF5E6" stroke-width="1.5"/>
      <circle cx="6" cy="12" r="1.6" fill="#1A1512"/>
      <circle cx="14" cy="12" r="1.6" fill="#1A1512"/>
      <rect x="2" y="20" width="4" height="7" fill="#FF6F00">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="14" y="20" width="4" height="7" fill="#FF6F00">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <circle cx="0" cy="19.5" r="4" fill="#FF8C00" opacity="0">
    <animate attributeName="opacity" values="0;0;0" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
