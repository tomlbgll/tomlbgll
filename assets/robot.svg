<svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Retro Robot Mascot">
  <defs>
    <filter id="rGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ground shadow, pulses opposite to float -->
  <ellipse cx="110" cy="245" rx="52" ry="9" fill="#1A1512" opacity="0.5">
    <animate attributeName="rx" values="52;40;52" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.25;0.5" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- signal waves from antenna -->
  <g fill="none" stroke="#FF6F00" stroke-width="2">
    <circle cx="110" cy="14" r="4" opacity="0">
      <animate attributeName="r" values="4;28" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="14" r="4" opacity="0">
      <animate attributeName="r" values="4;28" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating body group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite"/>

    <!-- antenna -->
    <line x1="110" y1="40" x2="110" y2="15" stroke="#FF6F00" stroke-width="3"/>
    <circle cx="110" cy="14" r="6" fill="#FF8C00" filter="url(#rGlow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <rect x="70" y="40" width="80" height="60" rx="14" fill="#FDF5E6" stroke="#FF6F00" stroke-width="3"/>
    <!-- eyes (blink) -->
    <ellipse cx="92" cy="70" rx="7" ry="7" fill="#1A1512">
      <animate attributeName="ry" values="7;7;0.6;7;7" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="128" cy="70" rx="7" ry="7" fill="#1A1512">
      <animate attributeName="ry" values="7;7;0.6;7;7" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- speaker grille mouth -->
    <rect x="98" y="85" width="4" height="8" fill="#FF6F00"/>
    <rect x="108" y="85" width="4" height="8" fill="#FF6F00"/>
    <rect x="118" y="85" width="4" height="8" fill="#FF6F00"/>

    <!-- body -->
    <rect x="55" y="100" width="110" height="90" rx="16" fill="#FF8C00" stroke="#FDF5E6" stroke-width="3"/>
    <!-- chest power core -->
    <circle cx="110" cy="145" r="13" fill="#1A1512" stroke="#FF6F00" stroke-width="2"/>
    <circle cx="110" cy="145" r="6" fill="#FF6F00">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- left arm, gentle sway -->
    <rect x="30" y="112" width="18" height="55" rx="8" fill="#FDF5E6" stroke="#FF6F00" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 39 112; -10 39 112; 0 39 112" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- right arm, waving -->
    <rect x="172" y="112" width="18" height="55" rx="8" fill="#FDF5E6" stroke="#FF6F00" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 181 112; 35 181 112; -8 181 112; 0 181 112" dur="1.8s" repeatCount="indefinite"/>
    </rect>

    <!-- legs, idle shuffle -->
    <rect x="80" y="188" width="20" height="38" rx="6" fill="#FF6F00">
      <animateTransform attributeName="transform" type="rotate" values="0 90 188; -6 90 188; 0 90 188" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="188" width="20" height="38" rx="6" fill="#FF6F00">
      <animateTransform attributeName="transform" type="rotate" values="0 130 188; 6 130 188; 0 130 188" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
