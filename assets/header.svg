<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal Header">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1512"/>
      <stop offset="100%" stop-color="#2A1E16"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="50%" stop-color="#FDF5E6"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FF8C00" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGrad)" stroke="url(#frameGrad)" stroke-width="3"/>

  <g clip-path="inset(10px round 12px)">
    <rect x="8" y="8" width="884" height="204" fill="url(#grid)" opacity="0.18">
      <animate attributeName="opacity" values="0.10;0.30;0.10" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="8" width="884" height="6" fill="#FF8C00" opacity="0.10">
      <animate attributeName="y" values="8;206;8" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- drifting dust particles -->
    <circle r="2" fill="#FDF5E6">
      <animate attributeName="cx" values="120;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;20" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.6" fill="#FF8C00">
      <animate attributeName="cx" values="260;260" dur="5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;20" dur="5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#FDF5E6">
      <animate attributeName="cx" values="620;620" dur="7s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;20" dur="7s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="3s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting satellite -->
    <g>
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 0,0 A 120 30 0 1 1 0.1,0" />
      <g transform="translate(730,45)">
        <rect x="-9" y="-4" width="18" height="8" rx="2" fill="#FF6F00"/>
        <rect x="-16" y="-2" width="6" height="4" fill="#FDF5E6"/>
        <rect x="10" y="-2" width="6" height="4" fill="#FDF5E6"/>
        <circle cx="0" cy="0" r="2.5" fill="#FDF5E6">
          <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- bezel lights -->
  <circle cx="30" cy="24" r="5" fill="#FF6F00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="24" r="5" fill="#FDF5E6">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="24" r="5" fill="#FF6F00">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <text x="860" y="29" font-family="'Courier New', monospace" font-size="12" fill="#F3E5AB" text-anchor="end" opacity="0.7">TX-01</text>

  <!-- name -->
  <text x="450" y="112" font-family="'Courier New', monospace" font-size="52" font-weight="bold"
        text-anchor="middle" fill="#FF8C00" filter="url(#glow)">
    &gt;_ YOUR_NAME
    <animate attributeName="opacity" values="1;0.82;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- typed slogan -->
  <clipPath id="reveal">
    <rect x="130" y="130" width="0" height="34">
      <animate attributeName="width" from="0" to="640" dur="3s" begin="0.4s" fill="freeze"/>
    </rect>
  </clipPath>
  <g clip-path="url(#reveal)">
    <text x="450" y="156" font-family="'Courier New', monospace" font-size="21"
          text-anchor="middle" fill="#FDF5E6">
      BUILDING TOMORROW WITH YESTERDAY'S GLOW
    </text>
  </g>
  <rect x="770" y="136" width="11" height="24" fill="#FDF5E6">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- mini waving robot, bottom-left corner -->
  <g transform="translate(45,150) scale(0.42)">
    <rect x="20" y="20" width="48" height="36" rx="9" fill="#FF8C00" stroke="#FDF5E6" stroke-width="2"/>
    <rect x="30" y="-8" width="28" height="24" rx="6" fill="#FDF5E6" stroke="#FF6F00" stroke-width="2"/>
    <circle cx="38" cy="4" r="2.5" fill="#1A1512">
      <animate attributeName="ry" values="2.5;2.5;0.3;2.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="4" r="2.5" fill="#1A1512">
      <animate attributeName="ry" values="2.5;2.5;0.3;2.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="44" y1="-8" x2="44" y2="-18" stroke="#FF6F00" stroke-width="2.5"/>
    <circle cx="44" cy="-19" r="3.5" fill="#FF6F00">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <rect x="4" y="22" width="12" height="30" rx="5" fill="#FDF5E6" stroke="#FF6F00" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" values="0 10 22; 40 10 22; -5 10 22; 0 10 22" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="22" width="12" height="30" rx="5" fill="#FDF5E6" stroke="#FF6F00" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="2.2s" repeatCount="indefinite"/>
      <rect x="24" y="58" width="10" height="16" rx="3" fill="#FF6F00"/>
      <rect x="54" y="58" width="10" height="16" rx="3" fill="#FF6F00"/>
    </g>
  </g>

  <!-- status bar -->
  <text x="30" y="196" font-family="'Courier New', monospace" font-size="13" fill="#FF6F00" opacity="0.85">STATUS: ONLINE</text>
  <text x="870" y="196" font-family="'Courier New', monospace" font-size="13" fill="#FF6F00" text-anchor="end" opacity="0.85">
    FREQ: 88.5 MHz
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </text>

  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#vignette)"/>
</svg>
